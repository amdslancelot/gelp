# Persistent storage for the SQLite database file, backed by k3s's built-in
# local-path provisioner. This is a single-node ReadWriteOnce volume, which is
# fine because the Deployment below always runs exactly one replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gelp-data
  namespace: gelp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
