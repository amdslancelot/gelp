# cert-manager ClusterIssuer that requests certificates from Let's Encrypt's
# production ACME endpoint via the HTTP-01 challenge served through k3s's
# bundled Traefik ingress controller.
#
# ${LETSENCRYPT_EMAIL} is substituted by `envsubst` in deploy/deploy.sh before
# this manifest is applied; it is not templated by Kubernetes itself.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${LETSENCRYPT_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
