# Prod overlay: k3s on the shared platform node, namespace gelp. TLS is NOT
# this overlay's concern — the platform repo's wildcard cert (*.lans-h.cc) is
# Traefik's default certificate for the whole node, so any Ingress with no
# tls block of its own picks it up automatically. No per-app ClusterIssuer.
#
# The gelp-env Secret is NOT committed here — deploy/deploy.sh applies it from a
# server-local file (see deploy/README.md); the database is the shared Postgres
# in the `data` namespace, owned by the platform repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gelp

resources:
  - namespace.yaml
  - ../../base

images:
  - name: gelp
    newTag: latest

# Set the real host on the base ingress (which ships a placeholder host for
# staging).
patches:
  - target:
      kind: Ingress
      name: gelp
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: gelp.lans-h.cc
