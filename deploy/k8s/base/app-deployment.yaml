# Runs the Gelp app server. The image is built locally and loaded into the
# target cluster's node image store (minikube image load in staging; k3s ctr
# import in prod) — there is no registry — so overlays set the tag and the
# pull policy tolerates a node-local image.
#
# The app is stateless now that data lives in Postgres, so a plain rolling
# update is safe; the single replica is a capacity choice, not a constraint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gelp
  labels:
    app: gelp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gelp
  template:
    metadata:
      labels:
        app: gelp
    spec:
      containers:
        - name: gelp
          image: gelp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: gelp-env
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
