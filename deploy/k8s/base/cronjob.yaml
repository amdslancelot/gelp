# Nightly import job: hits the app's own /api/cron/import endpoint over the
# in-cluster Service so it goes through the same code path (and auth check) as
# any other caller. The URL is namespace-relative (http://gelp) so this same
# manifest works unchanged in every namespace the overlay targets. Runs at
# 03:30 server time every day.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gelp-import
spec:
  # Ships SUSPENDED, because the endpoint it calls is a no-op until Drive sync
  # is configured: /api/cron/import returns 503 ("Drive sync is not configured")
  # unless BOTH GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 and DRIVE_FOLDER_ID are in the
  # gelp-env Secret. Neither has ever been set in prod, so from the day this
  # CronJob was deployed it produced one failed Job (3 attempts) every night and
  # nothing else. Failing nightly is worse than not running: it trains you to
  # ignore the one signal that would tell you a *configured* import broke.
  #
  # To enable, on the node: add both variables to /opt/gelp/.env.prod (see
  # README.md step 3 for how to mint the service-account key and share the Drive
  # folder), flip this to false, and redeploy — deploy.sh rebuilds the Secret
  # from .env.prod and re-applies this manifest.
  #
  # Note this whole single-tenant path (one service account, one folder, imports
  # for allowedEmails()[0]) is slated for replacement by per-user Drive OAuth —
  # see TODO.md "Per-user nightly Drive Takeout auto-sync", after which both
  # variables become obsolete. Enabling now is only worth it if you want the
  # single-user sync in the meantime.
  suspend: true
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: import
              image: curlimages/curl
              args:
                - --fail-with-body
                - --request
                - POST
                - http://gelp/api/cron/import
                - --header
                - "Authorization: Bearer $(CRON_SECRET)"
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: gelp-env
                      key: CRON_SECRET
