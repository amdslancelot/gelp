# Nightly import job: hits the app's own /api/cron/import endpoint over the
# in-cluster Service so it goes through the same code path (and auth check) as
# any other caller. The URL is namespace-relative (http://gelp) so this same
# manifest works unchanged in every namespace the overlay targets. Runs at
# 03:30 server time every day.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gelp-import
spec:
  # Runs for real now: /api/cron/import imports for every user who has connected
  # their own Drive and picked a folder on /settings. With nobody connected it
  # is a cheap no-op that returns an empty list — not a failure — so an idle
  # deployment no longer manufactures a failed Job every night.
  #
  # It used to ship suspended because the endpoint 503'd unless both
  # GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 and DRIVE_FOLDER_ID were set, which they
  # never were in prod: one failed Job (3 attempts) every night and nothing
  # else. Failing nightly is worse than not running — it trains you to ignore
  # the one signal that would tell you a *configured* import broke.
  #
  # One user's failure does not fail the Job either; it is recorded against that
  # user and shown on their settings page. So a red Job here means the run
  # itself could not happen (the app is down, CRON_SECRET is wrong), which is
  # the only thing worth waking up for.
  suspend: false
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: import
              image: curlimages/curl
              args:
                - --fail-with-body
                # The run imports every connected user in one request, so it can
                # take minutes. Long, but not unbounded: a hung app should fail
                # the Job rather than hold the schedule's next slot.
                - --max-time
                - "1800"
                - --request
                - POST
                - http://gelp/api/cron/import
                - --header
                - "Authorization: Bearer $(CRON_SECRET)"
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: gelp-env
                      key: CRON_SECRET
