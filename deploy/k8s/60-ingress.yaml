# Public HTTPS entrypoint, served by k3s's built-in Traefik ingress
# controller. cert-manager watches the cert-manager.io/cluster-issuer
# annotation and provisions/renews the TLS certificate named in
# spec.tls[].secretName automatically via the letsencrypt-prod ClusterIssuer.
#
# ${GELP_HOST} is substituted by `envsubst` in deploy/deploy.sh before this
# file is applied; it is not templated by Kubernetes itself.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gelp
  namespace: gelp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${GELP_HOST}
      secretName: gelp-tls
  rules:
    - host: ${GELP_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gelp
                port:
                  number: 80
