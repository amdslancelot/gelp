# Template for the Secret that supplies every environment variable the Gelp
# app needs at runtime (Auth.js, Google OAuth/Maps/Drive integration, the
# SQLite path, and the nightly-import cron shared secret).
#
# This file is safe to commit: every value below is a placeholder. To deploy:
#   1. Copy this file to 20-secret.yaml (that filename is gitignored, see
#      deploy/k8s/.gitignore, so real secrets never get committed).
#   2. Replace every placeholder value with the real one.
#   3. Apply it yourself with `kubectl apply -f deploy/k8s/20-secret.yaml`, or
#      let deploy/deploy.sh pick it up automatically on the next deploy.
#
# deploy/deploy.sh will NOT apply this example file, and will only apply
# 20-secret.yaml if it exists locally on the server.
apiVersion: v1
kind: Secret
metadata:
  name: gelp-env
  namespace: gelp
type: Opaque
stringData:
  # Auth.js (NextAuth) session/JWT signing secret. Generate with:
  #   openssl rand -base64 32
  AUTH_SECRET: "replace-with-openssl-rand-base64-32"

  # Google OAuth client used for sign-in.
  AUTH_GOOGLE_ID: "replace-with-google-oauth-client-id"
  AUTH_GOOGLE_SECRET: "replace-with-google-oauth-client-secret"

  # Canonical public URL of the deployed app; used by Auth.js to build
  # callback URLs. Substituted from $GELP_HOST at secret-creation time.
  AUTH_URL: "https://${GELP_HOST}"

  # Required by Auth.js when running behind a reverse proxy (Traefik).
  AUTH_TRUST_HOST: "true"

  # Comma-separated allowlist of Google account emails permitted to sign in.
  ALLOWED_EMAILS: "replace-with-comma-separated-emails@example.com"

  # Path to the SQLite database file inside the container; must match the
  # PVC mount path in 30-pvc.yaml / 40-deployment.yaml.
  DATABASE_PATH: "/data/gelp.db"

  # Used by the map view.
  GOOGLE_MAPS_API_KEY: "replace-with-google-maps-api-key"

  # Bearer token the gelp-import CronJob must present to
  # POST /api/cron/import. Generate with:
  #   openssl rand -hex 32
  CRON_SECRET: "replace-with-openssl-rand-hex-32"

  # Base64-encoded Google service account JSON key, used to read the Drive
  # folder that the nightly import pulls from.
  GOOGLE_SERVICE_ACCOUNT_KEY_BASE64: "replace-with-base64-encoded-service-account-json"

  # Google Drive folder ID that the nightly import job reads from.
  DRIVE_FOLDER_ID: "replace-with-drive-folder-id"
