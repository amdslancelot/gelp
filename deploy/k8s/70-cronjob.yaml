# Nightly import job: hits the app's own /api/cron/import endpoint over the
# in-cluster Service address so it goes through the same code path (and auth
# check) as any other caller, rather than reaching into the database
# directly. Runs at 03:30 server time every day.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gelp-import
  namespace: gelp
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: import
              image: curlimages/curl
              args:
                - --fail-with-body
                - --request
                - POST
                - http://gelp.gelp.svc.cluster.local/api/cron/import
                - --header
                - "Authorization: Bearer $(CRON_SECRET)"
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: gelp-env
                      key: CRON_SECRET
