# Stable in-cluster address for the app. The Ingress routes external HTTPS
# traffic here, and the gelp-import CronJob calls it directly at
# gelp.gelp.svc.cluster.local.
apiVersion: v1
kind: Service
metadata:
  name: gelp
  namespace: gelp
spec:
  selector:
    app: gelp
  ports:
    - name: http
      port: 80
      targetPort: 3000
